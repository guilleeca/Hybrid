<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rutina de Hybrid</title>
    <meta name="robots" content="noindex" />
    <!-- Enlace de una rutina compartida: /Hybrid/r/?id=… → la app web en #/r/… (con la app de Android instalada, se abre en ella) -->
    <script>
      var id = new URLSearchParams(location.search).get('id') || ''
      location.replace('../' + (/^[0-9a-f-]{36}$/i.test(id) ? '#/r/' + id : ''))
    </script>
    <style>
      body { margin: 0; background: #000; color: #fff; font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    </style>
  </head>
  <body>
    <p>Abriendo la rutina…</p>
  </body>
</html>
